<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <!-- 设置页：临时会话管理 + 技能库（暗色主题）-->
  <rect width="880" height="600" fill="#1E1F22"/>
  <text x="20" y="30" fill="#DFE1E5" font-size="14" font-weight="600">Settings</text>

  <!-- 左侧导航 -->
  <rect x="16" y="46" width="140" height="536" rx="8" fill="#2B2D30"/>
  <g font-size="12.5">
    <text x="30" y="76" fill="#9DA3AB">通用</text>
    <text x="30" y="106" fill="#9DA3AB">模型</text>
    <text x="30" y="136" fill="#9DA3AB">插件</text>
    <text x="30" y="166" fill="#9DA3AB">Agent 预设</text>
    <rect x="22" y="180" width="128" height="28" rx="6" fill="#3C3F44"/>
    <text x="30" y="199" fill="#DFE1E5" font-weight="600">临时会话</text>
    <text x="30" y="228" fill="#9DA3AB">技能库</text>
  </g>

  <!-- 右侧内容 -->
  <rect x="172" y="46" width="692" height="536" rx="8" fill="#1E1F22"/>

  <!-- 标题 + 说明 -->
  <text x="192" y="76" fill="#DFE1E5" font-size="13.5" font-weight="600">临时会话</text>
  <text x="272" y="76" fill="#7E848C" font-size="11">全局临时产物目录的查看与清理</text>
  <text x="192" y="98" fill="#7E848C" font-size="11">会话的临时产物目录（全局，不在工程里）：试验性的图、草稿、导出物都存在这，可以随时删掉</text>
  <text x="192" y="118" fill="#7E848C" font-size="11">共 4 个会话目录，合计 18.6 MB　·　~/.zhixueyao/Conversation/Product</text>

  <!-- 表格（限高 + 可滚） -->
  <rect x="192" y="132" width="652" height="200" rx="8" fill="#2B2D30" stroke="#3C3F44"/>
  <rect x="192" y="132" width="652" height="30" fill="#2E3135"/>
  <g font-size="11.5" fill="#9DA3AB">
    <text x="232" y="152">会话</text>
    <text x="380" y="152">创建时间</text>
    <text x="510" y="152">文件</text>
    <text x="566" y="152">大小</text>
    <text x="626" y="152">路径</text>
  </g>
  <line x1="192" y1="162" x2="844" y2="162" stroke="#3C3F44"/>

  <!-- 行 1 选中 -->
  <rect x="192" y="162" width="652" height="32" fill="#2B3A55"/>
  <rect x="206" y="172" width="14" height="14" rx="3" fill="#4A90D9" stroke="#4A90D9"/>
  <path d="M209 179 L212 182 L217 175" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="232" y="183" fill="#DFE1E5" font-size="12">抽象日出图标</text>
  <text x="380" y="183" fill="#DFE1E5" font-size="12">2026-09-28 00:02</text>
  <text x="510" y="183" fill="#DFE1E5" font-size="12">3</text>
  <text x="566" y="183" fill="#DFE1E5" font-size="12">2 KB</text>
  <text x="626" y="183" fill="#6CB6FF" font-size="11.5" font-family="monospace">…/Product/2026-09-28-00.02/抽象日</text>

  <!-- 行 2 -->
  <rect x="206" y="204" width="14" height="14" rx="3" fill="none" stroke="#6E7781"/>
  <text x="232" y="215" fill="#DFE1E5" font-size="12">4K 抽象风景</text>
  <text x="380" y="215" fill="#DFE1E5" font-size="12">2026-09-28 00:16</text>
  <text x="510" y="215" fill="#DFE1E5" font-size="12">2</text>
  <text x="566" y="215" fill="#DFE1E5" font-size="12">3.1 MB</text>
  <text x="626" y="215" fill="#6CB6FF" font-size="11.5" font-family="monospace">…/Product/2026-09-28-00.16/4K 抽象风</text>

  <!-- 行 3 -->
  <rect x="206" y="236" width="14" height="14" rx="3" fill="none" stroke="#6E7781"/>
  <text x="232" y="247" fill="#DFE1E5" font-size="12">登录页改造</text>
  <text x="380" y="247" fill="#DFE1E5" font-size="12">2026-09-27 22:41</text>
  <text x="510" y="247" fill="#DFE1E5" font-size="12">5</text>
  <text x="566" y="247" fill="#DFE1E5" font-size="12">14 MB</text>
  <text x="626" y="247" fill="#6CB6FF" font-size="11.5" font-family="monospace">…/Product/2026-09-27-22.41/登录页改</text>

  <!-- 行 4 -->
  <rect x="206" y="268" width="14" height="14" rx="3" fill="none" stroke="#6E7781"/>
  <text x="232" y="279" fill="#DFE1E5" font-size="12">图标试验</text>
  <text x="380" y="279" fill="#DFE1E5" font-size="12">2026-09-27 21:06</text>
  <text x="510" y="279" fill="#DFE1E5" font-size="12">9</text>
  <text x="566" y="279" fill="#DFE1E5" font-size="12">1.5 MB</text>
  <text x="626" y="279" fill="#6CB6FF" font-size="11.5" font-family="monospace">…/Product/2026-09-27-21.06/图标试验</text>

  <!-- 滚动条 -->
  <rect x="836" y="166" width="6" height="60" rx="3" fill="#4E5257"/>

  <!-- 工具栏（紧跟表格下方）-->
  <g font-size="11.5">
    <rect x="192" y="344" width="52" height="26" rx="6" fill="#3C3F44"/>
    <text x="218" y="361" fill="#DFE1E5" text-anchor="middle">全选</text>
    <rect x="250" y="344" width="60" height="26" rx="6" fill="#3C3F44"/>
    <text x="280" y="361" fill="#DFE1E5" text-anchor="middle">全不选</text>
    <rect x="316" y="344" width="52" height="26" rx="6" fill="#3C3F44"/>
    <text x="342" y="361" fill="#DFE1E5" text-anchor="middle">刷新</text>
    <rect x="374" y="344" width="86" height="26" rx="6" fill="#4A3A38"/>
    <text x="417" y="361" fill="#FF8A7A" text-anchor="middle">删除选中</text>
    <rect x="476" y="344" width="92" height="26" rx="6" fill="#3C3F44"/>
    <text x="522" y="361" fill="#DFE1E5" text-anchor="middle">打开总目录</text>
  </g>
  <text x="192" y="392" fill="#6E7781" font-size="10.5">双击某行 = 在文件管理器里打开该目录</text>

  <!-- 分隔 -->
  <line x1="192" y1="416" x2="844" y2="416" stroke="#3C3F44"/>

  <!-- 技能库 -->
  <text x="192" y="444" fill="#DFE1E5" font-size="13" font-weight="600">技能库</text>
  <text x="252" y="444" fill="#7E848C" font-size="11">AI 自己也能读写 —— 踩过的坑会固化下来，下次不再犯</text>
  <text x="192" y="464" fill="#7E848C" font-size="10.5">项目：&lt;工程&gt;/.zhixueyao/skills　全局：~/.zhixueyao/skills</text>

  <rect x="192" y="474" width="652" height="82" rx="8" fill="#2B2D30" stroke="#3C3F44"/>
  <g font-size="11.5">
    <text x="208" y="495" fill="#DFE1E5" font-weight="600">zhixueyao-swing-ui</text>
    <text x="348" y="495" fill="#7E848C" font-size="10.5">项目</text>
    <rect x="792" y="484" width="36" height="22" rx="6" fill="#3C3F44"/>
    <text x="810" y="499" fill="#FF8A7A" font-size="10.5" text-anchor="middle">删除</text>
    <text x="208" y="513" fill="#9DA3AB" font-size="11">这个工程里 Swing 界面反复踩的坑：圆角卡片、BoxLayout 对齐、caret 拽滚动…</text>

    <text x="208" y="535" fill="#DFE1E5" font-weight="600">zhixueyao-verify-probe</text>
    <text x="348" y="535" fill="#7E848C" font-size="10.5">项目</text>
    <rect x="792" y="524" width="36" height="22" rx="6" fill="#3C3F44"/>
    <text x="810" y="539" fill="#FF8A7A" font-size="10.5" text-anchor="middle">删除</text>
    <text x="208" y="551" fill="#9DA3AB" font-size="11">离线验证方法论：探针怎么写、headless 下哪些验不了、发布前泄漏检查…</text>
  </g>
</svg>
